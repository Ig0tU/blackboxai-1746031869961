<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent-S GUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .chat-container {
            height: calc(100vh - 180px);
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center">
                <img src="https://raw.githubusercontent.com/simular-ai/Agent-S/main/images/agent_s.png" alt="Agent-S Logo" class="w-12 h-12 mr-4">
                <h1 class="text-3xl font-bold text-gray-800">Agent-S GUI</h1>
            </div>
            <div class="flex space-x-4">
                <select id="model-select" class="px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="gemini-2.5-flash-preview-04-17">Gemini 2.5 Flash Preview</option>
                    <option value="gemini-2.5-pro-preview-03-25">Gemini 2.5 Pro Preview</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                    <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    <option value="gemini-1.5-vision-preview">Gemini 1.5 Vision Preview</option>
                    <option value="huggingface">HuggingFace</option>
                </select>
                <button onclick="checkKeys()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                    <i class="fas fa-key mr-2"></i>Check API Keys
                </button>
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <!-- Chat Messages -->
            <div id="chat-container" class="chat-container overflow-y-auto mb-6 space-y-4">
                <div class="flex items-start">
                    <div class="flex-shrink-0">
                        <img src="https://raw.githubusercontent.com/simular-ai/Agent-S/main/images/agent_s.png" alt="Agent" class="w-8 h-8">
                    </div>
                    <div class="ml-4 bg-gray-100 rounded-lg p-4 max-w-3xl">
                        <p class="text-gray-800">Hello! I'm Agent-S. I can help you with computer tasks. What would you like me to do?</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="flex items-center space-x-4">
                <div class="flex-grow">
                    <input type="text" id="user-input" placeholder="Type your instruction here..." 
                           class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="sendMessage()" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition">
                    <i class="fas fa-paper-plane mr-2"></i>Send
                </button>
            </div>
        </div>
    </div>

    <script>
        function checkKeys() {
            fetch('/check-keys')
                .then(response => response.json())
                .then(data => {
                    if (data.gemini && data.huggingface) {
                        alert('All API keys are configured!');
                    } else {
                        let message = 'Missing API keys:\n';
                        if (!data.gemini) message += '- GEMINI_API_KEY\n';
                        if (!data.huggingface) message += '- HF_TOKEN\n';
                        alert(message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error checking API keys');
                });
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';

            // Send to backend
            const model = document.getElementById('model-select').value;
            fetch('/execute', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    instruction: message,
                    model: model
                })
            })
            .then(response => response.json())
            .then(data => {
                addMessage(data.response, 'agent');
            })
            .catch(error => {
                console.error('Error:', error);
                addMessage('Sorry, there was an error processing your request.', 'agent');
            });
        }

        function addMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex items-start';
            
            const avatar = sender === 'user' ? 
                '<div class="flex-shrink-0"><i class="fas fa-user-circle text-2xl text-gray-600"></i></div>' :
                '<div class="flex-shrink-0"><img src="https://raw.githubusercontent.com/simular-ai/Agent-S/main/images/agent_s.png" alt="Agent" class="w-8 h-8"></div>';
            
            messageDiv.innerHTML = `
                ${avatar}
                <div class="ml-4 bg-gray-100 rounded-lg p-4 max-w-3xl">
                    <p class="text-gray-800">${text}</p>
                </div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Handle Enter key
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
